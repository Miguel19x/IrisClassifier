version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: iris-postgres
    environment:
      POSTGRES_DB: irisclassifier
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iris" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iris-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iris-backend
    environment:
      DATABASE_URL: postgresql://iris:${POSTGRES_PASSWORD:-changeme}@postgres:5432/irisclassifier
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/app/.cache
    networks:
      - iris-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iris-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - iris-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_cache:


networks:
  iris-network:
    driver: bridge
